name: Build Decade IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - README.md

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download full game from latest release if present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p game_payload
          if gh release download --pattern 'decade.zip' --dir game_payload; then
            echo 'Found decade.zip release asset. Replacing placeholder with the full game.'
            rm -rf App/Resources/Web
            mkdir -p App/Resources/Web
            unzip -q game_payload/decade.zip -d App/Resources/Web

            # If the archive contains one wrapper folder, flatten it automatically.
            shopt -s dotglob nullglob
            entries=(App/Resources/Web/*)
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              wrapper="${entries[0]}"
              tmp="$(mktemp -d)"
              mv "$wrapper"/* "$tmp"/ || true
              rm -rf App/Resources/Web/*
              mv "$tmp"/* App/Resources/Web/ || true
              rmdir "$tmp" || true
            fi
          else
            echo 'No decade.zip release asset found; building with the placeholder game page.'
          fi

      - name: Verify web entry point
        run: |
          set -euo pipefail
          test -f App/Resources/Web/index.html || {
            echo 'ERROR: App/Resources/Web/index.html was not found after extracting the game.'
            find App/Resources/Web -maxdepth 3 -type f | head -100 || true
            exit 1
          }
          echo "Game payload size before build:"
          du -sh App/Resources/Web

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project Decade.xcodeproj \
            -scheme Decade \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Force bundle full game into app
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Decade.app"
          test -d "$APP"

          # XcodeGen may flatten/omit a dynamically replaced resource directory.
          # Copy the complete web game directly into the final app bundle.
          rm -rf "$APP/Web"
          mkdir -p "$APP/Web"
          /usr/bin/ditto App/Resources/Web "$APP/Web"

          test -f "$APP/Web/index.html" || {
            echo 'ERROR: Web/index.html is missing from the final app bundle.'
            find "$APP" -maxdepth 3 -type f | head -100 || true
            exit 1
          }

          echo "Final bundled game size:"
          du -sh "$APP/Web"
          echo "Final app size:"
          du -sh "$APP"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Decade.app"
          test -f "$APP/Web/index.html"
          rm -rf Payload Decade-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/Decade.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Decade-unsigned.ipa
          ls -lh Decade-unsigned.ipa

          # Refuse to publish a tiny IPA again. A full Decade build should be far larger.
          SIZE=$(stat -f%z Decade-unsigned.ipa)
          if [ "$SIZE" -lt 50000000 ]; then
            echo "ERROR: IPA is unexpectedly small ($SIZE bytes). Game assets were not packaged correctly."
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Decade-IPA
          path: Decade-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
